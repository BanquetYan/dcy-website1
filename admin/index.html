<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鼎程溢｜網站管理後台</title><link rel="stylesheet" href="../css/admin.css"></head><body>
<section id="login" class="login"><img src="../images/dcy-logo.jpg"><h1>網站管理後台</h1><form id="loginForm"><input id="loginEmail" type="email" placeholder="Email" required><input id="loginPassword" type="password" placeholder="Password" required><button>登入</button></form><p id="loginMsg"></p></section>
<div id="app" class="admin-shell" hidden><aside><img src="../images/dcy-logo.jpg"><small>DCY CMS</small><button data-tab="about">關於我們</button><button data-tab="services">服務管理</button><button data-tab="materials">材料管理</button><button data-tab="projects">作品管理</button><button data-tab="dm">DM 管理</button><button data-tab="contact">聯絡資訊</button><button id="logoutBtn">登出</button></aside><main><div class="admin-top"><div><small>網站內容管理</small><h1 id="pageTitle">關於我們</h1></div><span id="userEmail"></span></div>
<section id="about" class="tab"><form id="aboutForm" class="formbox"><label>標題<input id="aTitle"></label><label>簡短介紹<textarea id="aSummary"></textarea></label><label>完整介紹<textarea id="aContent"></textarea></label><label>經營理念<textarea id="aPhilosophy"></textarea></label><button>儲存</button><p id="aboutMsg"></p></form></section>
<section id="services" class="tab" hidden><form id="serviceForm" class="formbox"><input id="sId" type="hidden"><label>服務名稱<input id="sName" required></label><label>首頁簡介<textarea id="sDesc"></textarea></label><label>完整介紹<textarea id="sFull"></textarea></label><label>適合應用<textarea id="sApps"></textarea></label><label>服務圖片<input id="sImage" type="file" accept="image/*"></label><label>排序<input id="sOrder" type="number" value="0"></label><label class="check"><input id="sActive" type="checkbox" checked> 官網顯示</label><div class="row"><button>儲存服務</button><button type="button" class="secondary" id="sReset">新增／清除</button></div></form><div id="serviceList" class="list"></div></section>
<section id="materials" class="tab" hidden><form id="materialForm" class="formbox"><input id="mId" type="hidden"><label>分類<input id="mCategory" placeholder="例如 FDM 線材" required></label><label>材料名稱<input id="mName" placeholder="例如 PLA" required></label><label>簡介<textarea id="mSummary"></textarea></label><label>完整介紹<textarea id="mFull"></textarea></label><label>材料特色<textarea id="mFeatures"></textarea></label><label>適合用途<textarea id="mApps"></textarea></label><label>注意事項<textarea id="mCautions"></textarea></label><div class="ratings-form"><label>強度<input id="mStrength" type="number" min="1" max="5" value="3"></label><label>韌性<input id="mToughness" type="number" min="1" max="5" value="3"></label><label>耐熱<input id="mHeat" type="number" min="1" max="5" value="3"></label><label>表面<input id="mSurface" type="number" min="1" max="5" value="3"></label></div><label>材料圖片<input id="mImage" type="file" accept="image/*"></label><label>排序<input id="mOrder" type="number" value="0"></label><label class="check"><input id="mActive" type="checkbox" checked> 官網顯示</label><div class="row"><button>儲存材料</button><button type="button" class="secondary" id="mReset">新增／清除</button></div></form><div id="materialList" class="list"></div></section>
<section id="projects" class="tab" hidden><form id="projectForm" class="formbox"><input id="pId" type="hidden"><label>案例名稱<input id="pTitle" required></label><label>客戶名稱<input id="pClient"></label><label class="check"><input id="pHideClient" type="checkbox" checked> 隱藏客戶名稱</label><label>使用服務<select id="pService"></select></label><label>使用材料<select id="pMaterial"></select></label><label>案例簡介<textarea id="pSummary"></textarea></label><label>完整介紹<textarea id="pContent"></textarea></label><label>封面照片<input id="pCover" type="file" accept="image/*"></label><label>作品照片（可多選）<input id="pGallery" type="file" accept="image/*" multiple></label><label class="check"><input id="pFeatured" type="checkbox"> 首頁精選</label><label class="check"><input id="pPublished" type="checkbox" checked> 發布</label><label>排序<input id="pOrder" type="number" value="0"></label><div class="row"><button>儲存案例</button><button type="button" class="secondary" id="pReset">新增／清除</button></div></form><div id="projectList" class="list"></div></section>
<section id="dm" class="tab" hidden><form id="dmForm" class="formbox"><label>DM 名稱<input id="dmTitle"></label><label>上傳 PDF<input id="dmFile" type="file" accept="application/pdf"></label><button>儲存／更新 DM</button><p id="dmMsg"></p></form></section>
<section id="contact" class="tab" hidden><form id="contactForm" class="formbox"><label>Email<input id="cEmail" type="email"></label><label class="check"><input id="showEmail" type="checkbox"> 顯示 Email</label><label>LINE 連結<input id="cLine"></label><label class="check"><input id="showLine" type="checkbox"> 顯示 LINE</label><label>電話<input id="cPhone"></label><label class="check"><input id="showPhone" type="checkbox"> 顯示電話</label><label>Instagram<input id="cInstagram"></label><label class="check"><input id="showInstagram" type="checkbox"> 顯示 Instagram</label><label>Facebook<input id="cFacebook"></label><label class="check"><input id="showFacebook" type="checkbox"> 顯示 Facebook</label><label>公司地址<input id="cAddress"></label><label class="check"><input id="showAddress" type="checkbox"> 顯示地址</label><button>儲存聯絡資訊</button><p id="contactMsg"></p></form></section>
</main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="admin.js"></script></body></html>
