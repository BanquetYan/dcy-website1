<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>鼎程溢｜網站管理後台</title><link rel="stylesheet" href="../css/admin.css"></head><body>
<div class="shell"><aside><img src="../images/dcy-logo.jpg"><h2>網站管理後台</h2><button data-tab="services">服務管理</button><button data-tab="materials">材料管理</button><button id="logout">登出</button></aside>
<main><section id="login"><h1>管理員登入</h1><p>使用 Supabase Authentication 建立的管理員 Email 登入。</p><form id="loginForm"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button>登入</button></form><p id="loginMsg"></p></section>
<section id="panel" hidden><div class="top"><div><small>DCY ADMIN</small><h1 id="title">服務管理</h1></div><span id="user"></span></div>
<div id="services" class="tab"><form id="serviceForm" class="editor"><input id="sname" placeholder="服務名稱" required><textarea id="sdesc" placeholder="服務說明"></textarea><input id="sorder" type="number" value="0" placeholder="排序"><button>＋ 新增服務</button></form><div id="serviceList"></div></div>
<div id="materials" class="tab" hidden><form id="materialForm" class="editor"><input id="mcat" placeholder="分類，例如 FDM 線材" required><input id="mname" placeholder="材料名稱，例如 PETG" required><input id="morder" type="number" value="0"><button>＋ 新增材料</button></form><div id="materialList"></div></div>
</section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="admin.js"></script></body></html>
